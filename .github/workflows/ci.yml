name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  platforms:
    name: tests and frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install GTK 4 development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev

      - name: Install .NET 10
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Test editor crates
        run: cargo test -p forge-core -p forge-editor -p forge-terminal -p forge-notes -p forge-docs

      - name: Clippy workspace
        if: runner.os == 'Linux'
        run: cargo clippy --workspace

      - name: Build GNOME frontend
        if: runner.os == 'Linux'
        run: cargo build --release --manifest-path frontends/gnome/Cargo.toml

      - name: Build macOS frontend
        if: runner.os == 'macOS'
        run: |
          scripts/build-apple.sh
          xcodebuild -project frontends/apple/Forge.xcodeproj -scheme Forge -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

      - name: Build Windows frontend
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Build hello plugin for WASI
        shell: bash
        run: |
          rustup target add wasm32-wasip2
          cargo build --manifest-path plugins/hello/Cargo.toml --release --target wasm32-wasip2

      - name: Build Forge and test SDKs
        shell: bash
        run: |
          cargo build --profile fast
          sdks/test.sh

  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  packages:
    name: package doctor and startup budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: package-ci
          key: ${{ runner.os }}-package-${{ hashFiles('**/Cargo.lock') }}
          cache-on-failure: true

      - name: Build Forge
        run: cargo build --locked --profile fast -p forge-terminal --bin forge

      - name: Stage the offline package fixture
        run: |
          mkdir -p "$RUNNER_TEMP/forge-ci/config"
          cp -R tests/fixtures/ci-packages/. "$RUNNER_TEMP/forge-ci/config/"
          echo "FORGE_DATA_DIR=$RUNNER_TEMP/forge-ci/data" >> "$GITHUB_ENV"
          echo "FORGE_CACHE_DIR=$RUNNER_TEMP/forge-ci/cache" >> "$GITHUB_ENV"
          echo "FORGE_STATE_DIR=$RUNNER_TEMP/forge-ci/state" >> "$GITHUB_ENV"

      - name: Package doctor
        run: target/fast/forge package doctor --json --init-directory "$RUNNER_TEMP/forge-ci/config"

      - name: Startup budget
        run: target/fast/forge --profile-startup --json --init-directory "$RUNNER_TEMP/forge-ci/config"

  licenses:
    name: Allowed dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny

      - name: Check dependency licenses
        run: cargo deny check licenses

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Document the workspace
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Print docs coverage
        run: cargo run -p xtask -- coverage

      - name: Check the doc registry and manual links
        run: cargo run -p xtask -- docs --check

      - name: Check the WIT comments
        run: cargo run -p xtask -- wit --check

      - name: Check the man page is current
        run: cargo run -p xtask -- man --check
