[package]
name = "forge-canvas"
description = "Forge's canvas: a scene of shapes, paths, text and pictures that any frontend can draw"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.11", optional = true }
fontdue = { version = "0.9", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }

[features]
default = ["raster"]
# The CPU rasteriser (tiny-skia + fontdue). Plugins that only build scenes
# turn it off and stay small.
raster = ["dep:tiny-skia", "dep:fontdue", "dep:image"]
