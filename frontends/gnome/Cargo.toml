[package]
name = "forge-gnome"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Forge for GNOME: GTK 4 draws the editor's grid (text, pictures and canvases) and the system file picker"

# Not part of the main workspace: building it needs GTK 4's development
# files (libgtk-4-dev, or gtk4-devel), which the editor itself doesn't.
[workspace]

[dependencies]
# gpu: canvases are drawn with wgpu (Vulkan) when the machine has an adapter.
forge-ffi = { path = "../../crates/ffi", features = ["gpu"] }
gtk4 = { version = "0.10", features = ["v4_10"] }
pangocairo = "0.21"
async-channel = "2"
serde_json = "1"
pollster = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
